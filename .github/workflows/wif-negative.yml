# Negative control for the trust boundary. It runs from a workflow file that is NOT in the IAM
# bindings and tries to become both service accounts. The job is green only if Google REFUSES
# both — a green run here means the boundary held; a red run means it leaked.
name: wif-negative
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  must-be-denied:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: as_deployer
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - id: as_publisher
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
      - name: Assert both were refused
        env:
          DEPLOYER: ${{ steps.as_deployer.outcome }}
          PUBLISHER: ${{ steps.as_publisher.outcome }}
          REF: ${{ github.ref }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          echo "caller: $WORKFLOW"
          echo "as deployer:  $DEPLOYER"
          echo "as publisher: $PUBLISHER"
          [ "$DEPLOYER" = failure ] && [ "$PUBLISHER" = failure ] || { echo "::error::the trust boundary let an unlisted workflow in"; exit 1; }
          echo "DENIED-AS-EXPECTED"
