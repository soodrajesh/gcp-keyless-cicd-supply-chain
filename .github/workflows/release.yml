# On every push to main: test -> build -> vulnerability gate -> push -> sign (Sigstore, keyless)
# -> SBOM attestation -> SLSA build provenance -> deploy by digest (deploy.yml).
name: release
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # mint the OIDC token for Google (WIF) and for Sigstore (Fulcio)
      attestations: write   # store the SLSA provenance attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: ${{ vars.REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/keyless/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - run: pip install -r app/requirements-dev.txt
      - run: PYTHONPATH=app pytest app/tests -q

      - name: Build
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" \
            --build-arg RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -t candidate:build .
      - name: Vulnerability gate (before anything is pushed)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:build
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: candidate:build
          format: cyclonedx
          output: sbom.cdx.json

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISHER_SA }}
          token_format: access_token
      - name: Push
        id: push
        run: |
          echo "${{ steps.auth.outputs.access_token }}" | docker login -u oauth2accesstoken --password-stdin "$REGISTRY"
          TAG="sha-${GITHUB_SHA::12}"
          docker tag candidate:build "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG" | cut -d@ -f2)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign keyless (certificate identity is this workflow, recorded in the Rekor log)
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      - name: Attach the SBOM as a signed attestation
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.push.outputs.digest }}"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.build.outputs.digest }}
      expect_sha: ${{ github.sha }}
